name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  packed-smoke:
    # Fast PR subset of the exact npm artifact contract. Linux and macOS run
    # the supported lifecycle path; Windows runs the same honest public-CLI
    # subset (install/status/custom-port up+down/hook/MCP/restart/isolation).
    name: packed smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: packed tarball smoke
        run: npm run test:packed:smoke
        env:
          MEMWARDEN_PACKED_ARTIFACTS: ${{ runner.temp }}/memwarden-packed-contract
      - name: archive packed-contract failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packed-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/memwarden-packed-contract
          if-no-files-found: warn

  firewall-eval:
    # The launch claims plus the controlled fine-grained-anchor corpus,
    # measured on every push; false blocking and missed invalidations must stay 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval
      - run: npm run eval:anchors
