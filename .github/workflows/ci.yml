name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  packed-smoke:
    # Fast PR subset of the exact npm artifact contract. Linux and macOS run
    # the supported lifecycle path; Windows runs the same honest public-CLI
    # subset (install/status/custom-port up+down/hook/MCP/restart/isolation).
    name: packed smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: packed tarball smoke
        run: npm run test:packed:smoke
        env:
          MEMWARDEN_PACKED_ARTIFACTS: ${{ runner.temp }}/memwarden-packed-contract
      - name: archive packed-contract failure logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: packed-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/memwarden-packed-contract
          if-no-files-found: warn

  firewall-eval:
    # The launch claims, measured on every push: stale-refusal, fresh
    # retention, project isolation, label accuracy — all must hold at 100%.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval
